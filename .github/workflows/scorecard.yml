name: Scorecard

# OpenSSF Scorecard: rates the supply chain practices of this repository (pinned dependencies, token permissions,
# dangerous workflows, code review and others), publishes the result to scorecard.dev, where the README badge reads it,
# and uploads the findings to code scanning (free on a public repository); raising the score is separate work.
#
# A file of its own because publishing imposes rules on the workflow
# (https://github.com/ossf/scorecard-action#workflow-restrictions): no top-level env or defaults and no workflow-level
# write permissions; the job has no env, no containers and no run steps, runs on ubuntu, and only its job has
# id-token: write. Its steps may use only actions/checkout, actions/upload-artifact, github/codeql-action/upload-sarif,
# step-security/harden-runner and the Scorecard action itself: any other step makes the API reject the result at run
# time, which actionlint and zizmor do not catch (tests/Build.Tests.ps1 checks them).
#
# The SHA pin fixes the action's metadata, but v2.5.0 runs the container image ghcr.io/ossf/scorecard-action:v2.5.0 by
# tag, not by digest, and a step pinning the image itself would break the rules above. The job holds no contents write
# and no persisted credentials, which bounds what a replaced image could do.
on:
  push:
    branches: [main]
  # Monday 05:23 UTC: away from the start of the hour, when GitHub delays scheduled runs.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

# One analysis at a time; a newer run waits instead of cancelling one that may be publishing or uploading. No
# branch_protection_rule trigger: it fires only for classic branch protection, and main is protected by a ruleset.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # uploads the findings to code scanning
      id-token: write # proves to the Scorecard API which workflow produced the result it publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default token reads what a public repository shows; Branch-Protection and Webhooks would need an admin
      # token, which this workflow does not get.
      - name: Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
